name: SystemPulse checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript checks
        run: npm run typecheck
      - name: JavaScript lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Electron launch smoke test (headless)
        run: |
          set +e
          timeout 20s xvfb-run -a npm run dev:ci
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "Electron did not stay running for the smoke-test window (exit $status)."
            exit 1
          fi
          echo "Electron and Vite stayed running for 20 seconds."
